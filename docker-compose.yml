services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/auth
      # Override these in a .env file next to this compose file for anything but a local demo.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-please-1234}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me-please-123}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-8080}
      TRUST_PROXY: 'true'
      LOG_LEVEL: info
      # Behind the nginx proxy over plain http on localhost the cookie cannot be Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '3000:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  mongo-data:
